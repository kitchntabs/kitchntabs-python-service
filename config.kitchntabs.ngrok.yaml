APP_NAME: kitchntabs
WS_HOST: "pw-ws.ngrok.dev"
WS_PORT: ""
WS_SCHEME: "https"
API_HOST: "pw-api.ngrok.dev"
API_PORT: ""
API_SCHEME: "https"
APP: "dash"

#APP_NAME: "pinoywok"
#WS_HOST: "localhost"
#WS_PORT: 6001
#WS_SCHEME: "http"
#API_HOST: "localhost"
#API_PORT: 8000
#API_SCHEME: "http"

AUTH_ENDPOINT: "api/ws/auth"

LOGS_PATH: "./logs/"

# Poppler path for PDF conversion
# Windows: C:\poppler-24.08.0\Library\bin
# Linux/Mac: Leave empty (uses system poppler-utils)
POPPLER_PATH: ""

# Printer USB IDs
# EPSON TM-m30: VENDOR=0x04b8, PRODUCT=0x0e20
# POS58/PT-210: VENDOR=0x0FE6, PRODUCT=0x811E
PRINTER_VENDOR: 0x04b8
PRINTER_PRODUCT: 0x0e20

# Alternative printer for Raspberry Pi (POS58/PT-210)
# PRINTER_VENDOR: 0x0FE6
# PRINTER_PRODUCT: 0x811E

# Linux device path (for direct file printing)
PRINTER_DEVICE_PATH: "/dev/usb/lp0"
# CUPS printer name (optional)
PRINTER_NAME: ""

LIBUSB_PATH: ""
WKHTMLTOPDF_PATH: ""
ACROBAT_PATH: ""
GOOGLE_MAPS_API_KEY: ""
JUMPSELLER_SECRET_KEY: ""
TWILIO_ID: ""
TWILIO_TOKEN: ""

# Speech/TTS Messages
SPEECH_WELCOME_MESSAGE: "Bienvenido a Kitchen Tabs"
SPEECH_CONNECTED_MESSAGE: "Conectado al servidor"
SPEECH_DISCONNECTED_MESSAGE: "Desconectado del servidor"
SPEECH_LANGUAGE: "es"